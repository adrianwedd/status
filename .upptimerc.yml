  # ╔══════════════════════════════════════╗
  # ║  adrianwedd.com                      ║
  # ╚══════════════════════════════════════╝
  - name: adrianwedd.com
    url: https://adrianwedd.com
    icon: https://adrianwedd.com/favicon.svg
    expectedStatusCodes:
      - 200

  - name: adrianwedd.com CDN
    url: https://cdn.adrianwedd.com/test-api-upload.txt
    icon: https://adrianwedd.com/favicon.svg
    method: HEAD
    expectedStatusCodes:
      - 200

  - name: adrianwedd.com Sitemap
    url: https://adrianwedd.com/sitemap-index.xml
    icon: https://adrianwedd.com/favicon.svg
    expectedStatusCodes:
      - 200

  - name: adrianwedd.com Podcast RSS
    url: https://adrianwedd.com/audio/feed.xml
    icon: https://adrianwedd.com/favicon.svg
    expectedStatusCodes:
      - 200

  - name: adrianwedd.com Blog RSS
    url: https://adrianwedd.com/blog/rss.xml
    icon: https://adrianwedd.com/favicon.svg
    expectedStatusCodes:
      - 200

  # Authenticated: the worker returns 503 when any platform token is invalid,
  # so this alerts on FB/IG/Bluesky/Twitter token expiry, not just up-ness.
  - name: Social Worker
    url: https://social.adrianwedd.com/api/health
    icon: https://adrianwedd.com/favicon.svg
    headers:
      - "Authorization: Bearer $SECRET_SITE"
    expectedStatusCodes:
      - 200

  - name: Contact Page
    url: https://adrianwedd.com/contact/
    icon: https://adrianwedd.com/favicon.svg
    expectedStatusCodes:
      - 200

  - name: Booking Page
    url: https://book.adrianwedd.com
    icon: https://adrianwedd.com/favicon.svg
    expectedStatusCodes:
      - 200

  # Fixed weekday date keeps the query static while still forcing the
  # worker's service-account freeBusy call — an auth failure returns 500,
  # so a 200 proves the whole Calendar auth path, not just the worker.
  - name: Booking API (slots)
    url: https://api.book.adrianwedd.com/slots?date=2030-01-01
    icon: https://adrianwedd.com/favicon.svg
    expectedStatusCodes:
      - 200

  # Refreshes the Gmail OAuth token server-side (no email sent); 503 when
  # the refresh token dies, which /book deliberately hides (emailSent:false).
  - name: Booking API (Gmail health)
    url: https://api.book.adrianwedd.com/health
    icon: https://adrianwedd.com/favicon.svg
    expectedStatusCodes:
      - 200

  - name: Ops Worker (enquiry API)
    url: https://ops.adrianwedd.com/api/health
    icon: https://adrianwedd.com/favicon.svg
    expectedStatusCodes:
      - 200

